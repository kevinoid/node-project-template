name: TruffleHog Secret Scanning

# Note: on key treated as boolean key by YAML
# https://github.com/adrienverge/yamllint/issues/158#issuecomment-454313233
# However, GitHub Actions documentation is consistent in using it unquoted.
on:   # yamllint disable-line rule:truthy
  pull_request:
    branches-ignore:
    - template
  push:
    branches-ignore:
    - template
  workflow_dispatch: {}

permissions: {}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
    - name: Determine depth and refs to fetch
      id: find_refs
      shell: bash
      run: |
        set -Ceu
        depth=0
        head=
        case "$GITHUB_EVENT_NAME" in
        pull_request)
          depth=$(jq '.pull_request.commits + 2' "$GITHUB_EVENT_PATH")
          ;;
        push)
          depth=$(jq '.commits | length + 2' "$GITHUB_EVENT_PATH")
          # On force push, the "before" commit may not be reachable, so
          # don't let the action use it as the base.  Scan from HEAD only.
          if [ "$(jq '.forced' "$GITHUB_EVENT_PATH")" = true ]; then
            head=$GITHUB_SHA
          fi
          ;;
        esac
        echo "depth=$depth" >>"$GITHUB_OUTPUT"
        echo "head=$head" >>"$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: ${{ steps.find_refs.outputs.depth }}
        persist-credentials: false
    - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb   # v3.99.8
      with:
        head: ${{ steps.find_refs.outputs.head }}
        extra_args: --fail-on-scan-errors --no-verification
